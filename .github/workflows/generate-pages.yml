name: Generate Crossing Pages

on:
  workflow_dispatch:          # ručno pokretanje preko Actions taba
  push:
    branches: [main]
    paths:                    # pokreni SAMO kad se promeni izvor stranica -
      - 'borders-data.js'     # workflow commituje samo HTML, pa nema beskonacne petlje
      - 'generate_crossing_pages.py'

permissions:
  contents: write

concurrency:
  group: generate-pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # generator koristi samo standardnu biblioteku - nema pip install

      - name: Generate pages
        run: python generate_crossing_pages.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -n "$(git status --porcelain granica-*.html en/)" ]; then
            git add granica-*.html en/border-*.html
            git commit -m "Auto-regenerate crossing pages"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && exit 0
              echo "Pokusaj $i nije uspeo, ponavljam..."
              sleep 5
            done
            echo "Push nije uspeo ni iz treceg pokusaja."
            exit 1
          else
            echo "Nema promena."
          fi
