name: Update HERE granice

on:
  schedule:
    - cron: "5,35 * * * *"     # pomereno da se ne sudara sa ostalima
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-here
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape HERE traffic at border crossings
        env:
          HERE_KEY: ${{ secrets.HERE_KEY }}
        run: python putevi_scraper.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain granice_here.json)" ]; then
            git add granice_here.json
            git commit -m "Auto update HERE traffic at crossings"
            # povuci tudje commitove pa tek onda push (izbegava 'fetch first' gresku)
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && exit 0
              echo "Pokusaj $i nije uspeo, ponavljam..."
              sleep 5
            done
            echo "Push nije uspeo ni iz treceg pokusaja."
            exit 1
          else
            echo "Nema promena."
          fi
