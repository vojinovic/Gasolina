name: Update Fuel Prices

on:
  workflow_dispatch:        # ručno pokretanje preko Actions taba
  schedule:
    - cron: '0 18 * * 5'    # svakog petka u 18:00 UTC (20:00 po našem)

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fuel_prices.json
          git commit -m "Auto update fuel prices" || echo "No changes"
          git push
