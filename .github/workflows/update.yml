name: Update Fuel Prices

on:
  workflow_dispatch:        # ručno pokretanje preko Actions taba
  schedule:
    - cron: '0 7 * * 6'    # svake subote u 07:00 UTC (09:00 po nasem leti) - namerno POSLE petka
                            # kad se u Srbiji menja cena goriva, da izvori sigurno stignu da se azuriraju
                            # pre nego sto mi ocitamo (petak uvece je znalo da uhvati staru cenu)

permissions:
  contents: write

concurrency:
  group: update-fuel
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -n "$(git status --porcelain fuel_prices.json cene_istorija.csv)" ]; then
            git add fuel_prices.json cene_istorija.csv
            git commit -m "Auto update fuel prices"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && exit 0
              echo "Pokusaj $i nije uspeo, ponavljam..."
              sleep 5
            done
            echo "Push nije uspeo ni iz treceg pokusaja."
            exit 1
          else
            echo "Nema promena."
          fi
