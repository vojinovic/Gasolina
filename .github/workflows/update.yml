name: Update Fuel Prices

on:
  workflow_dispatch:
  schedule:
    # Cena se menja PETKOM u 15h po beogradskom vremenu = 13:00 UTC (leti),
    # 14:00 UTC (zimi). Ministarstvo objavu okaci tog dana, ali ne uvek u isti
    # minut, a GitHub-ov cron ume da kasni 5-15 minuta pod opterecenjem - zato
    # se ne oslanjamo na jedno tacno pokretanje nego na niz provera.
    #
    # Ovo je bezbedno tek od 01.08.2026, kad je scraper dobio dve zastite:
    # upisuje samo kad se cena stvarno promeni (pecat vremena se ne pomera bez
    # promene), i odbija objavu kojoj je period vazenja istekao. Bez toga bi
    # ovoliko pokretanja pravilo gomilu praznih commit-ova i pages deploy-ova.
    - cron: '0,30 12-17 * * 5'   # petak 12:00-17:30 UTC, na pola sata
    - cron: '0 7 * * 6'          # subota ujutru - rezerva ako je petak sve promasio
    - cron: '0 7 * * 1'          # ponedeljak - hvata objave van uobicajenog rasporeda

permissions:
  contents: write

concurrency:
  group: update-fuel
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Python skripte zive u privatnom repou gasolina-engine. Ovde se povlace
      # u podfolder engine/ koji NE ide u commit (vidi .gitignore). Minuti se
      # naplacuju repou u kom se workflow izvrsava - a ovaj je javan, pa su
      # besplatni. Token: fine-grained, samo Contents:read na engine repou.
      - name: Checkout engine (private)
        uses: actions/checkout@v4
        with:
          repository: vojinovic/gasolina-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # Skripta se pokrece IZ korena javnog repoa (da nadje fuel_prices.json
      # i cene_istorija.csv), ali sam kod dolazi iz engine/.
      - name: Run scraper
        run: python engine/scraper.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -n "$(git status --porcelain fuel_prices.json cene_istorija.csv)" ]; then
            git add fuel_prices.json cene_istorija.csv
            git commit -m "Auto update fuel prices"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && exit 0
              echo "Pokusaj $i nije uspeo, ponavljam..."
              sleep 5
            done
            echo "Push nije uspeo ni iz treceg pokusaja."
            exit 1
          else
            echo "Nema promena."
          fi
