name: Update putevi

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-putevi
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape road incidents (TomTom)
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: python putevi_scraper.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain putevi.json)" ]; then
            git add putevi.json
            git commit -m "Auto update road incidents"
            git push
          else
            echo "Nema promena."
          fi
