name: Probe TomTom

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe TomTom endpoints
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: python putevi_scraper.py --probe
