name: Update granice

on:
  schedule:
    - cron: "*/30 * * * *"   # na svakih 30 minuta
  workflow_dispatch: {}        # rucno pokretanje dugmetom

permissions:
  contents: write

concurrency:
  group: update-granice
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape border wait times
        run: python granice_scraper.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain granice.json)" ]; then
            git add granice.json
            git commit -m "Auto update border wait times"
            git push
          else
            echo "Nema promena."
          fi
