name: Update granice

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-granice
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python skripte zive u privatnom repou gasolina-engine. Povlace se u
      # engine/ koji je u .gitignore, pa ne moze da zavrsi u javnom commitu.
      # Minuti se naplacuju repou u kom se workflow izvrsava (ovaj je javan).
      - name: Checkout engine (private)
        uses: actions/checkout@v4
        with:
          repository: vojinovic/gasolina-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape border wait times
        run: python engine/granice_scraper.py
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # amss-arhiv/ je sirov AMSS sadrzaj koji upisuje granice_scraper.py.
          # Bez ovoga bi nastajao na runneru i nestajao sa njim.
          # git status trpi putanju koja ne postoji, ali `git add` na nepostojecu
          # putanju je fatalna greska - a arhiviranje SME da otkaze (zove se u
          # try/except u scraperu). Zato se dodaje tek ako direktorijum postoji,
          # i to punim `if`-om: `[ -d x ] && git add x` bi kao POSLEDNJA naredba
          # u bloku oborio ceo korak zbog izlaznog koda, sto je tiha mina za
          # nekog ko sutra doda red ispod.
          if [ -n "$(git status --porcelain granice.json istorija.csv amss-arhiv)" ]; then
            git add granice.json istorija.csv
            if [ -d amss-arhiv ]; then
              git add amss-arhiv
            fi
            git commit -m "Auto update border wait times"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && exit 0
              echo "Pokusaj $i nije uspeo, ponavljam..."
              sleep 5
            done
            echo "Push nije uspeo ni iz treceg pokusaja."
            exit 1
          else
            echo "Nema promena."
          fi
