name: Update pumpe

on:
  schedule:
    - cron: "20 3 * * 1"      # ponedeljkom u 3:20 UTC (pumpe se retko menjaju)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-pumpe
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python skripte zive u privatnom repou gasolina-engine. Povlace se u
      # engine/ koji je u .gitignore, pa ne moze da zavrsi u javnom commitu.
      # Minuti se naplacuju repou u kom se workflow izvrsava (ovaj je javan).
      - name: Checkout engine (private)
        uses: actions/checkout@v4
        with:
          repository: vojinovic/gasolina-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape fuel stations (OpenStreetMap)
        run: python engine/pumpe_scraper.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain pumpe.json)" ]; then
            git add pumpe.json
            git commit -m "Auto update fuel stations (OSM)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && exit 0
              echo "Pokusaj $i nije uspeo, ponavljam..."
              sleep 5
            done
            exit 1
          else
            echo "Nema promena."
          fi
