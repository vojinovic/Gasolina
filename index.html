<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gasolina. cene goriva i granice na Balkanu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0d1620;
      --panel:#15212e;
      --panel-2:#1b2a39;
      --line:#26384a;
      --line-2:#324658;
      --text:#e9eff5;
      --dim:#8aa0b2;
      --faint:#5d7387;
      --fuel:#f5a623;
      --ok:#2fbf71;
      --warn:#f4c430;
      --lpg:#5fb0e8;
      --bad:#e35d4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(900px 500px at 82% -10%, rgba(245,166,35,0.08), transparent 60%),
        var(--ink);
      color: var(--text);
      font-family: system-ui,-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing:antialiased;
    }
    .container { max-width: 1180px; margin: 0 auto; padding: 28px 18px 60px; }

    /* Shared site nav */
    .topbar{position:sticky;top:0;z-index:50;background:rgba(13,22,32,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
    .topbar .inner{max-width:1180px;margin:0 auto;padding:0 18px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:9px;text-decoration:none}
    .brand .mark{width:26px;height:26px;border-radius:7px;background:var(--fuel);display:grid;place-items:center;color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px}
    .brand .bname{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
    .nav{display:flex;align-items:center;gap:4px}
    .nav a{font-size:13px;color:var(--dim);text-decoration:none;padding:7px 11px;border-radius:8px;font-weight:500;cursor:pointer}
    .nav a:hover{color:var(--text);background:var(--panel)}
    .nav a[aria-current="page"]{color:var(--ink);background:var(--fuel);font-weight:600}

    /* Hero */
    .hero{margin:26px 0 22px}
    .eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fuel);display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--fuel);box-shadow:0 0 0 4px rgba(245,166,35,.15)}
    h1 { font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size: clamp(30px,5vw,46px); line-height:.98; letter-spacing:.01em; text-transform:uppercase; margin: 0 0 6px; }
    .subtitle { color: var(--dim); margin: 0 0 8px; font-size: 16px; }
    .meta { color: var(--faint); margin: 0; font-size: 12px; font-family:"JetBrains Mono",monospace; letter-spacing:.03em; }

    .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 24px; }
    .toggle { display: inline-flex; gap: 0; background: var(--panel); border:1px solid var(--line); border-radius: 999px; padding: 4px; }
    .toggle button {
      background: transparent; color: var(--dim); border: 0;
      padding: 8px 18px; border-radius: 999px; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.15s;
    }
    .toggle button.active { background: var(--fuel); color: var(--ink); }
    .sort-wrap { display: inline-flex; align-items: center; gap: 10px; color: var(--dim); font-size: 14px; }
    .sort-wrap select, .calc-input select, .calc-input input {
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer;
    }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
    .card {
      background: var(--panel); border-radius: 14px; padding: 22px;
      border: 1px solid var(--line); transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--line-2); }
    .country { font-family:"Barlow Condensed",sans-serif; font-size: 26px; margin-bottom: 3px; font-weight: 700; text-transform:uppercase; letter-spacing:.01em; }
    .currency-info { font-size: 11px; color: var(--faint); margin-bottom: 18px; font-family:"JetBrains Mono",monospace; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; font-size: 16px; gap: 12px; }
    .fuel-name { color: var(--dim); display: flex; align-items: center; gap: 6px; }
    .fuel-price { font-weight: 700; font-family:"JetBrains Mono",monospace; font-variant-numeric: tabular-nums; text-align: right; }
    .fuel-price .secondary { font-size: 11px; color: var(--faint); font-weight: 500; margin-left: 6px; }
    .green { color: var(--ok); } .yellow { color: var(--warn); } .blue { color: var(--lpg); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; vertical-align: middle;
      font-family:"JetBrains Mono",monospace;
    }
    .badge-best { background: rgba(47,191,113,0.15); color: var(--ok); border: 1px solid rgba(47,191,113,0.4); }
    .badge-worst { background: rgba(227,93,79,0.15); color: var(--bad); border: 1px solid rgba(227,93,79,0.4); }
    .updated { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; font-family:"JetBrains Mono",monospace; }

    .calc-form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 24px; }
    .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .calc-input { display: flex; flex-direction: column; gap: 6px; }
    .calc-input label { color: var(--dim); font-size: 13px; }
    .calc-input select, .calc-input input { width: 100%; }
    .calc-input .range-row { display: flex; align-items: center; gap: 10px; }
    .calc-input input[type="range"] { flex: 1; padding: 0; cursor: pointer; background: transparent; border: 0; accent-color: var(--fuel); }
    .calc-input .val { min-width: 70px; text-align: right; font-weight: 700; color: var(--text); font-family:"JetBrains Mono",monospace; font-variant-numeric: tabular-nums; }

    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .result-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    .result-box.smart { border-color: rgba(47,191,113,0.5); }
    .result-box h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--dim); font-weight: 600; font-family:"JetBrains Mono",monospace; }
    .result-box .total { font-family:"JetBrains Mono",monospace; font-size: 32px; font-weight: 700; margin: 8px 0 16px; font-variant-numeric: tabular-nums; }
    .result-box.smart .total { color: var(--ok); }
    .result-box .step { font-size: 14px; color: var(--dim); margin-bottom: 6px; line-height: 1.5; }
    .result-box .step strong { color: var(--text); }
    .savings-banner {
      background: linear-gradient(135deg, rgba(47,191,113,0.14), rgba(245,166,35,0.08));
      border: 1px solid rgba(47,191,113,0.4); border-radius: 14px; padding: 20px 24px; text-align: center; margin-bottom: 24px;
    }
    .savings-banner .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-family:"JetBrains Mono",monospace; }
    .savings-banner .amount { font-family:"JetBrains Mono",monospace; font-size: 36px; font-weight: 700; color: var(--ok); font-variant-numeric: tabular-nums; }
    .savings-banner .pct { color: var(--dim); font-size: 14px; margin-top: 6px; }

    .empty { text-align: center; padding: 60px 20px; color: var(--faint); }

    @media (max-width: 720px) { .results { grid-template-columns: 1fr; } }
    @media (max-width: 600px) {
      .container { padding: 20px 14px 48px; }
      .subtitle { font-size: 15px; }
      .cards { grid-template-columns: 1fr; gap: 14px; }
      .card { padding: 18px; }
      .calc-form { padding: 18px; }
      .calc-grid { grid-template-columns: 1fr; gap: 14px; }
      .controls { gap: 12px; }
      .toggle button { padding: 10px 16px; }
      .savings-banner .amount { font-size: 30px; }
      .result-box .total { font-size: 26px; }
      .calc-input input[type="range"] { height: 28px; }
      .nav a{padding:6px 8px;font-size:12px}
      .brand .bname{font-size:18px}
    }
    a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--fuel); outline-offset: 2px; }
    /* Home hero + izlog */
    .home-hero { padding: 26px 0 24px; }
    .home-hero .subtitle { max-width: 58ch; font-size: 16px; margin-bottom: 0; }
    .route-pick { display: flex; gap: 10px; margin-top: 18px; max-width: 640px; flex-wrap: wrap; }
    .route-pick select { flex: 1; min-width: 230px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; font-size: 15px; cursor: pointer; }
    .route-btn { background: var(--fuel); color: var(--ink); border: none; border-radius: 10px; padding: 13px 20px; font-family: "Barlow Condensed",sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 16px; cursor: pointer; white-space: nowrap; }
    .route-btn:hover { filter: brightness(1.06); }

    .showcase { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 6px 0 32px; }
    .sc { display: flex; flex-direction: column; gap: 7px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
    .sc:hover { transform: translateY(-2px); border-color: var(--line-2); }
    .sc .lab { font-family: "JetBrains Mono",monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
    .sc .big { font-family: "Barlow Condensed",sans-serif; font-weight: 700; font-size: 21px; line-height: 1.05; text-transform: uppercase; }
    .sc .sub { font-size: 13px; color: var(--dim); line-height: 1.45; }
    .sc .go { margin-top: auto; padding-top: 6px; font-size: 12px; color: var(--fuel); font-weight: 600; }

    .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; flex-wrap: wrap; }
    .sec-head h2 { font-family: "Barlow Condensed",sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase; margin: 0; letter-spacing: .01em; }
    .sec-head .meta { margin: 0; }

    @media (max-width: 760px) { .showcase { grid-template-columns: 1fr; } }

    .rb-box { border-color: rgba(245,166,35,0.45); background: linear-gradient(180deg, rgba(245,166,35,0.05), transparent 60%), var(--panel); }
    .rb-box h3 { margin-bottom: 10px; color: var(--fuel); }
    .rb-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
    .rb-row.first { border-top:0; }
    .rb-route { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--faint); letter-spacing:.04em; }
    .rb-arr { color:var(--fuel); }
    .rb-name { font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:19px; text-transform:uppercase; line-height:1.05; margin-top:2px; }
    .rb-road { font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:5px; padding:1px 5px; margin-left:4px; }
    .rb-wait { display:flex; align-items:center; gap:7px; justify-content:flex-end; flex-wrap:wrap; }
    .rb-dot { width:8px; height:8px; border-radius:50%; flex:none; }
    .rb-min { font-family:"JetBrains Mono",monospace; font-weight:700; font-size:18px; }
    .rb-cat { font-size:11px; color:var(--dim); width:100%; text-align:right; }
    .rb-foot { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:11px; color:var(--faint); font-family:"JetBrains Mono",monospace; }
    .rb-foot a { color:var(--fuel); text-decoration:none; }
    .rb-foot a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="inner">
      <a class="brand" href="index.html">
        <span class="mark">G</span>
        <span class="bname">Gasolina</span>
      </a>
      <div class="nav">
        <a href="#" id="navPrices" onclick="setTab('prices');return false" aria-current="page">Cene goriva</a>
        <a href="#" id="navCalc" onclick="setTab('calc');return false">Kalkulator</a>
        <a href="granice.html">Granice</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- PRICES / HOME -->
    <section id="viewPrices">
      <header class="home-hero">
        <div class="eyebrow"><span class="dot"></span> Gorivo, granice i kamere na Balkanu</div>
        <h1>Put bez iznenadjenja</h1>
        <p class="subtitle">Cene goriva, kalkulator puta i stanje na granicama. Sve pre polaska, na jednom mestu.</p>
        <div class="route-pick">
          <select id="heroRoute" aria-label="Izaberi rutu"></select>
          <button class="route-btn" onclick="goRoute()">Izracunaj rutu \u2192</button>
        </div>
      </header>

      <div class="showcase" id="showcase"></div>

      <div class="sec-head">
        <h2>Cene goriva</h2>
        <p class="meta" id="meta">Ucitavanje...</p>
      </div>
      <div class="controls">
        <div class="toggle" role="tablist">
          <button id="btnEur" class="active" onclick="setView('eur')">EUR</button>
          <button id="btnLocal" onclick="setView('local')">Lokalna valuta</button>
        </div>
        <div class="sort-wrap">
          <span>Sortiraj:</span>
          <select id="sortSel" onchange="setSort(this.value)">
            <option value="default">Podrazumevano</option>
            <option value="name">Po imenu (A-Z)</option>
            <option value="petrol95">Po benzinu 95</option>
            <option value="diesel">Po dizelu</option>
            <option value="lpg">Po auto-gasu</option>
          </select>
        </div>
      </div>
      <div class="cards" id="cards"></div>
    </section>
    <!-- (kraj home/prices sekcije) -->

    <!-- CALCULATOR -->
    <section id="viewCalc" style="display:none">
      <div class="calc-form">
        <div class="calc-grid">
          <div class="calc-input">
            <label for="routeSel">Ruta</label>
            <select id="routeSel" onchange="renderCalc()"></select>
          </div>
          <div class="calc-input">
            <label for="fuelSel">Vrsta goriva</label>
            <select id="fuelSel" onchange="renderCalc()">
              <option value="diesel">Dizel</option>
              <option value="petrol95">Benzin 95</option>
              <option value="lpg">Auto-gas (LPG)</option>
            </select>
          </div>
          <div class="calc-input">
            <label for="returnSel">Povratak</label>
            <select id="returnSel" onchange="renderCalc()">
              <option value="oneway">Samo odlazak</option>
              <option value="roundtrip" selected>Povratak (ista ruta)</option>
            </select>
          </div>
          <div class="calc-input">
            <label for="consInp">Potrošnja (L/100km)</label>
            <div class="range-row">
              <input id="consInp" type="range" min="3" max="15" step="0.1" value="7" oninput="renderCalc()"/>
              <span class="val" id="consVal">7,0 L</span>
            </div>
          </div>
          <div class="calc-input">
            <label for="tankInp">Veličina rezervoara (L)</label>
            <div class="range-row">
              <input id="tankInp" type="range" min="30" max="100" step="1" value="50" oninput="renderCalc()"/>
              <span class="val" id="tankVal">50 L</span>
            </div>
          </div>
          <div class="calc-input">
            <label for="startInp">Početno gorivo</label>
            <div class="range-row">
              <input id="startInp" type="range" min="0" max="100" step="5" value="25" oninput="renderCalc()"/>
              <span class="val" id="startVal">25%</span>
            </div>
          </div>
        </div>
      </div>
      <div id="calcOutput"></div>
    </section>
  </div>

  <script src="borders-data.js"></script>
  <script>
    let dataCache = null;
    let currentTab = 'prices';
    let currentView = 'eur';
    let currentSort = 'default';

    const COUNTRY_NAMES = {
      RS: 'Serbia', HR: 'Croatia', BA: 'Bosnia and Herzegovina', ME: 'Montenegro',
      SI: 'Slovenia', MK: 'North Macedonia', HU: 'Hungary', BG: 'Bulgaria', AL: 'Albania', GR: 'Greece',
    };
    const COUNTRY_FLAG = {
      RS: '🇷🇸', HR: '🇭🇷', BA: '🇧🇦', ME: '🇲🇪', SI: '🇸🇮', MK: '🇲🇰',
      HU: '🇭🇺', BG: '🇧🇬', AL: '🇦🇱', GR: '🇬🇷', RO: '🇷🇴',
    };
    const COUNTRY_LABEL = {
      RS: 'Srbija', HR: 'Hrvatska', BA: 'BiH', ME: 'Crna Gora', SI: 'Slovenija',
      MK: 'S. Makedonija', HU: 'Mađarska', BG: 'Bugarska', AL: 'Albanija', GR: 'Grčka', RO: 'Rumunija',
    };

    const ROUTES = [
      { id: 'bg-bd', label: 'Beograd → Budva (Crna Gora)', legs: [{c:'RS', km:330}, {c:'ME', km:200}] },
      { id: 'bg-sa', label: 'Beograd → Sarajevo', legs: [{c:'RS', km:140}, {c:'BA', km:150}] },
      { id: 'bg-st', label: 'Beograd → Split', legs: [{c:'RS', km:120}, {c:'HR', km:600}] },
      { id: 'bg-sk', label: 'Beograd → Skopje', legs: [{c:'RS', km:330}, {c:'MK', km:110}] },
      { id: 'bg-lj', label: 'Beograd → Ljubljana', legs: [{c:'RS', km:120}, {c:'HR', km:280}, {c:'SI', km:130}] },
      { id: 'bg-zg', label: 'Beograd → Zagreb', legs: [{c:'RS', km:130}, {c:'HR', km:270}] },
      { id: 'ni-sk', label: 'Niš → Skopje', legs: [{c:'RS', km:120}, {c:'MK', km:110}] },
      { id: 'zg-bg', label: 'Zagreb → Beograd', legs: [{c:'HR', km:270}, {c:'RS', km:130}] },
      { id: 'lj-bg', label: 'Ljubljana → Beograd', legs: [{c:'SI', km:130}, {c:'HR', km:280}, {c:'RS', km:120}] },
      { id: 'st-sa', label: 'Split → Sarajevo', legs: [{c:'HR', km:140}, {c:'BA', km:110}] },
      { id: 'bg-so', label: 'Beograd → Solun (Grčka)', legs: [{c:'RS', km:330}, {c:'MK', km:170}, {c:'GR', km:160}] },
      { id: 'bg-sf', label: 'Beograd → Sofija', legs: [{c:'RS', km:240}, {c:'BG', km:150}] },
      { id: 'ni-sf', label: 'Niš → Sofija', legs: [{c:'RS', km:60}, {c:'BG', km:105}] },
      { id: 'bg-bp', label: 'Beograd → Budimpešta', legs: [{c:'RS', km:170}, {c:'HU', km:210}] },
      { id: 'bg-ti', label: 'Beograd → Tirana (Albanija)', legs: [{c:'RS', km:330}, {c:'ME', km:200}, {c:'AL', km:300}] },
    ];

    function fmt(value, currency) {
      if (value === null || value === undefined) return '-';
      const opts = { minimumFractionDigits: 2, maximumFractionDigits: 2 };
      const num = Number(value).toLocaleString('sr-RS', opts);
      if (currency === 'EUR') return num + ' €';
      return num + ' ' + currency;
    }
    function fmtEur(value) { return fmt(value, 'EUR'); }
    function findCountry(code) {
      if (!dataCache) return null;
      return dataCache.countries.find(c => c.name === COUNTRY_NAMES[code]) || null;
    }
    function priceCell(fuel, country) {
      if (!fuel) return '<span style="color:#475569">-</span>';
      if (currentView === 'eur') {
        return `${fmt(fuel.eur, 'EUR')}<span class="secondary">${fmt(fuel.local, country.currency)}</span>`;
      }
      return `${fmt(fuel.local, country.currency)}<span class="secondary">${fmt(fuel.eur, 'EUR')}</span>`;
    }

    function computeBestWorst(countries) {
      const fuels = ['petrol95', 'diesel', 'lpg'];
      const result = { petrol95: {}, diesel: {}, lpg: {} };
      fuels.forEach(f => {
        const valid = countries.filter(c => c[f] && typeof c[f].eur === 'number');
        if (valid.length < 2) return;
        const min = valid.reduce((a, b) => a[f].eur < b[f].eur ? a : b);
        const max = valid.reduce((a, b) => a[f].eur > b[f].eur ? a : b);
        result[f].best = min.name; result[f].worst = max.name;
      });
      return result;
    }
    function badgeFor(fuelKey, country, bw) {
      const x = bw[fuelKey];
      if (!x) return '';
      if (country.name === x.best) return ' <span class="badge badge-best">najjeftinije</span>';
      if (country.name === x.worst) return ' <span class="badge badge-worst">najskuplje</span>';
      return '';
    }
    function sortCountries(countries) {
      const arr = [...countries];
      const byEur = (k) => (a, b) => (a[k]?.eur ?? Infinity) - (b[k]?.eur ?? Infinity);
      switch (currentSort) {
        case 'name': return arr.sort((a, b) => a.name.localeCompare(b.name));
        case 'petrol95': return arr.sort(byEur('petrol95'));
        case 'diesel': return arr.sort(byEur('diesel'));
        case 'lpg': return arr.sort(byEur('lpg'));
        default: return arr;
      }
    }
    function renderPrices() {
      const cards = document.getElementById('cards');
      cards.innerHTML = '';
      if (!dataCache?.countries?.length) { cards.innerHTML = '<div class="empty">Nema podataka.</div>'; return; }
      const bw = computeBestWorst(dataCache.countries);
      sortCountries(dataCache.countries).forEach(c => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="country">${c.flag || ''} ${c.name}</div>
          <div class="currency-info">Valuta: ${c.currency}${c.fx_rate_eur && c.currency !== 'EUR' ? ` · 1 EUR ≈ ${c.fx_rate_eur} ${c.currency}` : ''}</div>
          <div class="price-row"><span class="fuel-name">Benzin 95${badgeFor('petrol95', c, bw)}</span><span class="fuel-price green">${priceCell(c.petrol95, c)}</span></div>
          <div class="price-row"><span class="fuel-name">Dizel${badgeFor('diesel', c, bw)}</span><span class="fuel-price yellow">${priceCell(c.diesel, c)}</span></div>
          <div class="price-row"><span class="fuel-name">Auto-gas${badgeFor('lpg', c, bw)}</span><span class="fuel-price blue">${priceCell(c.lpg, c)}</span></div>
          <div class="updated">Ažurirano: ${c.updated || '-'}</div>`;
        cards.appendChild(card);
      });
    }

    function getFuelEur(country, fuelKey) { return (country && country[fuelKey]) ? country[fuelKey].eur : null; }

    function computeTrip() {
      const route = ROUTES.find(r => r.id === document.getElementById('routeSel').value);
      const fuelKey = document.getElementById('fuelSel').value;
      const cons = parseFloat(document.getElementById('consInp').value);
      const tank = parseFloat(document.getElementById('tankInp').value);
      const startPct = parseFloat(document.getElementById('startInp').value);
      if (!route || !dataCache) return null;

      const returnMode = document.getElementById('returnSel').value;
      const isRoundtrip = returnMode === 'roundtrip';
      const tripLegs = isRoundtrip ? [...route.legs, ...route.legs.slice().reverse()] : route.legs;

      const totalKm = tripLegs.reduce((sum, l) => sum + l.km, 0);
      const totalFuelNeeded = (totalKm * cons) / 100;
      const startFuel = (startPct / 100) * tank;
      const fuelToBuy = Math.max(0, totalFuelNeeded - startFuel);

      const legs = tripLegs.map(l => {
        const country = findCountry(l.c);
        return { ...l, country, fuelOnLeg: (l.km * cons) / 100, pricePerL: getFuelEur(country, fuelKey),
                 flag: COUNTRY_FLAG[l.c], label: COUNTRY_LABEL[l.c] };
      });

      const naiveCountry = legs[0]?.country;
      const naivePrice = getFuelEur(naiveCountry, fuelKey);
      const naiveCost = naivePrice ? fuelToBuy * naivePrice : null;

      const minPriceByLeg = legs.map((_, i) =>
        legs.slice(i).filter(l => l.pricePerL).reduce((min, l) => Math.min(min, l.pricePerL), Infinity));

      let tankLevel = startFuel;
      const plan = [];
      let smartCost = 0;

      for (let i = 0; i < legs.length; i++) {
        const leg = legs[i];
        const need = leg.fuelOnLeg;
        const remainingKmAfterThis = legs.slice(i + 1).reduce((s, l) => s + l.km, 0);
        const fuelStillNeededAfterThis = (remainingKmAfterThis * cons) / 100;
        const cheapestAhead = minPriceByLeg[i];
        if (leg.pricePerL && leg.pricePerL <= cheapestAhead + 1e-6) {
          const neededTotalFromHere = need + fuelStillNeededAfterThis;
          const buyAmount = Math.min(tank - tankLevel, Math.max(0, neededTotalFromHere - tankLevel));
          if (buyAmount > 0.01) {
            smartCost += buyAmount * leg.pricePerL;
            plan.push({ flag: leg.flag, label: leg.label, liters: buyAmount, price: leg.pricePerL, cost: buyAmount * leg.pricePerL });
            tankLevel += buyAmount;
          }
        }
        tankLevel -= need;
        if (tankLevel < -0.01) {
          const forced = Math.min(tank, -tankLevel + 5);
          if (leg.pricePerL) {
            smartCost += forced * leg.pricePerL;
            plan.push({ flag: leg.flag, label: leg.label, liters: forced, price: leg.pricePerL, cost: forced * leg.pricePerL, forced: true });
            tankLevel += forced;
          }
        }
      }
      return { route, fuelKey, cons, tank, startFuel, totalKm, totalFuelNeeded, fuelToBuy, legs, naiveCost, naiveCountry, smartCost, plan };
    }

    function fuelLabel(key) { return { diesel: 'dizel', petrol95: 'benzin 95', lpg: 'auto-gas' }[key]; }

    let borderWaits = {};   // id -> {putnicka, teretna} iz granice.json
    let borderStamp = null; // scraped_at

    function bStatus(min) {
      if (min == null) return { c: 'var(--faint)', t: 'nema podataka' };
      if (min <= 30) return { c: 'var(--ok)', t: 'prohodno' };
      if (min <= 90) return { c: 'var(--warn)', t: 'umereno' };
      return { c: 'var(--bad)', t: 'velika guzva' };
    }
    function bMin(m) { if (m == null) return '-'; if (m >= 60) { const h = Math.floor(m/60), r = m%60; return r ? `${h}h ${r}m` : `${h}h`; } return `${m} min`; }
    function bText(m) { if (m == null) return '-'; if (m <= 30) return 'Bez guzve'; return bMin(m); }

    function routeCrossings(route) {
      const seen = new Set(), out = [];
      for (let i = 0; i < route.legs.length - 1; i++) {
        BORDERS.forPair(route.legs[i].c, route.legs[i+1].c).forEach(cx => {
          if (!seen.has(cx.id)) { seen.add(cx.id); out.push(cx); }
        });
      }
      return out;
    }

    function bordersPanel(route) {
      if (typeof BORDERS === 'undefined') return '';
      const list = routeCrossings(route);
      if (!list.length) return '';
      const rows = list.map((cx, i) => {
        const w = borderWaits[cx.id] || cx.wait;
        const pOut = w && w.putnicka ? w.putnicka.izlaz : null;
        const tOut = w && w.teretna ? w.teretna.izlaz : null;
        const s = bStatus(pOut);
        return `
        <div class="rb-row${i === 0 ? ' first' : ''}">
          <div class="rb-main">
            <div class="rb-route">${BORDERS.FLAG[cx.from]} ${cx.from} <span class="rb-arr">\u2192</span> ${BORDERS.FLAG[cx.to]} ${cx.to}</div>
            <div class="rb-name">${cx.name} <span class="rb-road">${cx.road}</span></div>
          </div>
          <div class="rb-wait">
            <span class="rb-dot" style="background:${s.c}"></span>
            <span class="rb-min" style="color:${s.c}">${bText(pOut)}</span>
            <span class="rb-cat">putnicka, izlaz${tOut != null ? ' &middot; kamioni ' + bText(tOut) : ''}</span>
          </div>
        </div>`;
      }).join('');
      const stamp = borderStamp
        ? `Cekanje: Uprava granicne policije RS &middot; ${new Date(borderStamp).toLocaleString('sr-RS')}`
        : `Demo cekanje (granice.json jos nije ucitan)`;
      return `
        <div class="result-box rb-box">
          <h3>\uD83D\uDEA7 Granice na ovoj ruti</h3>
          ${rows}
          <div class="rb-foot">${stamp} &middot; <a href="granice.html">kamere i detalji \u2192</a></div>
        </div>`;
    }

    function renderCalc() {
      document.getElementById('consVal').textContent = parseFloat(document.getElementById('consInp').value).toFixed(1).replace('.', ',') + ' L';
      document.getElementById('tankVal').textContent = document.getElementById('tankInp').value + ' L';
      document.getElementById('startVal').textContent = document.getElementById('startInp').value + '%';

      const out = document.getElementById('calcOutput');
      const t = computeTrip();
      if (!t) { out.innerHTML = ''; return; }
      const fuelText = fuelLabel(t.fuelKey);

      let smartHtml = '';
      if (t.plan.length === 0) {
        smartHtml = `<div class="step">Imaš dovoljno goriva za ceo put. nema potrebe za punjenjem.</div>`;
      } else {
        t.plan.forEach((p, i) => {
          smartHtml += `<div class="step">${i + 1}. ${p.flag} <strong>${p.label}</strong>: kupi <strong>${p.liters.toFixed(1).replace('.', ',')} L</strong> po ${fmtEur(p.price)} = <strong>${fmtEur(p.cost)}</strong></div>`;
        });
      }
      const naiveHtml = t.naiveCost !== null
        ? `<div class="step">Kupi sve gorivo (${t.fuelToBuy.toFixed(1).replace('.', ',')} L) u ${COUNTRY_FLAG[t.legs[0].c]} <strong>${COUNTRY_LABEL[t.legs[0].c]}</strong> po ${fmtEur(t.legs[0].pricePerL)}</div>`
        : `<div class="step">Nedostaju cene za izabranu zemlju polaska.</div>`;
      const savings = (t.naiveCost !== null && t.smartCost > 0) ? Math.max(0, t.naiveCost - t.smartCost) : 0;
      const savingsPct = (t.naiveCost > 0) ? (savings / t.naiveCost) * 100 : 0;

      out.innerHTML = `
        ${savings > 0.5 ? `<div class="savings-banner"><div class="label">Pametna strategija ti štedi</div><div class="amount">${fmtEur(savings)}</div><div class="pct">${savingsPct.toFixed(0)}% jeftinije nego naivno (${fuelText})</div></div>` : ''}
        ${bordersPanel(t.route)}
        <div class="results">
          <div class="result-box smart"><h3>🧠 Pametna strategija</h3><div class="total">${t.smartCost > 0 ? fmtEur(t.smartCost) : '-'}</div>${smartHtml}</div>
          <div class="result-box"><h3>😴 Naivno (sve u polasku)</h3><div class="total">${t.naiveCost !== null ? fmtEur(t.naiveCost) : '-'}</div>${naiveHtml}</div>
        </div>
        <div class="result-box">
          <h3>📋 Detalji puta</h3>
          <div class="step">Ruta: <strong>${t.route.label}</strong> (${t.totalKm} km)</div>
          <div class="step">Potrošnja: ${t.cons.toFixed(1).replace('.', ',')} L/100km · Rezervoar: ${t.tank} L · Početno gorivo: ${(t.startFuel).toFixed(1).replace('.', ',')} L</div>
          <div class="step">Ukupno potrebno: <strong>${t.totalFuelNeeded.toFixed(1).replace('.', ',')} L</strong> · Treba kupiti: <strong>${t.fuelToBuy.toFixed(1).replace('.', ',')} L</strong></div>
          <div class="step" style="margin-top:10px">Cene ${fuelText} po deonici:</div>
          ${t.legs.map(l => `<div class="step">${l.flag} ${l.label} (${l.km} km): ${l.pricePerL ? fmtEur(l.pricePerL) + ' / L' : '<span style="color:#f87171">cena nedostupna</span>'}</div>`).join('')}
        </div>`;
    }

    function populateRoutes() {
      const opts = ROUTES.map(r => `<option value="${r.id}">${r.label}</option>`).join('');
      document.getElementById('routeSel').innerHTML = opts;
      const hero = document.getElementById('heroRoute');
      if (hero) hero.innerHTML = opts;
    }

    function goRoute() {
      const hero = document.getElementById('heroRoute');
      if (hero) document.getElementById('routeSel').value = hero.value;
      setTab('calc');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function fuelExtremes(key) {
      if (!dataCache) return null;
      const v = dataCache.countries.filter(c => c[key] && typeof c[key].eur === 'number');
      if (v.length < 2) return null;
      const min = v.reduce((a, b) => a[key].eur < b[key].eur ? a : b);
      const max = v.reduce((a, b) => a[key].eur > b[key].eur ? a : b);
      return { min, max };
    }

    function worstBorder() {
      if (typeof BORDERS === 'undefined') return null;
      let best = null;
      BORDERS.CROSSINGS.forEach(cx => {
        const w = borderWaits[cx.id];
        if (!w) return;
        const arr = [];
        if (w.putnicka) { arr.push(['putnicka', w.putnicka.ulaz]); arr.push(['putnicka', w.putnicka.izlaz]); }
        if (w.teretna)  { arr.push(['kamioni', w.teretna.ulaz]); arr.push(['kamioni', w.teretna.izlaz]); }
        arr.forEach(([k, m]) => { if (m != null && (!best || m > best.min)) best = { name: cx.name, kind: k, min: m }; });
      });
      return best;
    }

    function renderShowcase() {
      const el = document.getElementById('showcase');
      if (!el) return;
      const n = (typeof BORDERS !== 'undefined') ? BORDERS.CROSSINGS.length : 0;

      const fx = fuelExtremes('diesel');
      let fuelBig = '—', fuelSub = 'Ucitavanje cena...';
      if (fx) {
        fuelBig = `${fx.min.flag || ''} ${fx.min.name}`;
        fuelSub = `Najniza cena dizela (po dostupnim podacima): ${fmtEur(fx.min.diesel.eur)}/L. Najvisa: ${fx.max.flag || ''} ${fx.max.name} (${fmtEur(fx.max.diesel.eur)}).`;
      }

      const wb = worstBorder();
      let bBig, bSub;
      if (!wb) { bBig = 'Ucitavanje...'; bSub = `Pratimo ${n} prelaza.`; }
      else if (wb.min <= 30) { bBig = 'Svi prohodni'; bSub = `Trenutno nema guzve na ${n} pracenih prelaza.`; }
      else { bBig = wb.name; bSub = `Najveca guzva: ${wb.kind} ${bMin(wb.min)}. Pratimo ${n} prelaza.`; }

      el.innerHTML = `
        <a class="sc" href="#cards">
          <div class="lab">⛽ Cene goriva (region)</div>
          <div class="big">${fuelBig}</div>
          <div class="sub">${fuelSub}</div>
          <div class="go">Uporedi sve cene →</div>
        </a>
        <a class="sc" href="#" onclick="setTab('calc');window.scrollTo({top:0,behavior:'smooth'});return false">
          <div class="lab">🧭 Kalkulator puta</div>
          <div class="big">Gde sipati da ustedis</div>
          <div class="sub">Izracunaj gorivo i trosak za svoju rutu i dobij pametnu strategiju punjenja.</div>
          <div class="go">Otvori kalkulator →</div>
        </a>
        <a class="sc" href="granice.html">
          <div class="lab">🚧 Stanje na granicama</div>
          <div class="big">${bBig}</div>
          <div class="sub">${bSub}</div>
          <div class="go">Procena cekanja + kamere uzivo →</div>
        </a>`;
    }

    function setTab(tab) {
      currentTab = tab;
      const np = document.getElementById('navPrices');
      const nc = document.getElementById('navCalc');
      if (tab === 'prices') { np.setAttribute('aria-current','page'); nc.removeAttribute('aria-current'); }
      else { nc.setAttribute('aria-current','page'); np.removeAttribute('aria-current'); }
      document.getElementById('viewPrices').style.display = tab === 'prices' ? '' : 'none';
      document.getElementById('viewCalc').style.display = tab === 'calc' ? '' : 'none';
      if (tab === 'calc') renderCalc();
    }
    function setView(view) {
      currentView = view;
      document.getElementById('btnEur').classList.toggle('active', view === 'eur');
      document.getElementById('btnLocal').classList.toggle('active', view === 'local');
      renderPrices();
    }
    function setSort(sort) { currentSort = sort; renderPrices(); }

    async function load() {
      try {
        const res = await fetch('fuel_prices.json?cb=' + Date.now());
        dataCache = await res.json();
        const dates = dataCache.countries.map(c => c.updated).filter(Boolean);
        document.getElementById('meta').textContent =
          `${dataCache.countries.length} zemalja · poslednje ažuriranje: ${dates[0] || '-'}`;
        populateRoutes();
        renderPrices();
        renderShowcase();
        if (location.hash === '#kalkulator') setTab('calc');
        try {
          const r2 = await fetch('granice.json?cb=' + Date.now());
          if (r2.ok) {
            const gj = await r2.json();
            borderStamp = gj.scraped_at || null;
            const cr = gj.crossings || {};
            Object.keys(cr).forEach(id => {
              const c = cr[id];
              if (c && c.found && c.putnicka) borderWaits[id] = { putnicka: c.putnicka, teretna: c.teretna || null };
            });
            renderShowcase();
            if (currentTab === 'calc') renderCalc();
          }
        } catch (e) { /* nema granice.json, ostaju demo brojke */ }
      } catch (err) {
        document.getElementById('meta').textContent = 'Greška pri učitavanju podataka.';
        console.error(err);
      }
    }
    load();
  </script>
</body>
