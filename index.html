<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gasolina</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 40px;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 320px;
    }

    .country {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 20px;
    }

    .green {
      color: #22c55e;
    }

    .yellow {
      color: #facc15;
    }

    .blue {
      color: #38bdf8;
    }

    .updated {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>⛽ Gasolina</h1>
  <p>Balkan Fuel Prices</p>

  <div class="cards" id="cards"></div>

  <script>
    async function loadPrices() {
      const response = await fetch('fuel_prices.json');
      const data = await response.json();

      const cardsContainer = document.getElementById('cards');

      data.countries.forEach(country => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="country">
            ${country.flag} ${country.name}
          </div>

          <div class="price-row">
            <span>Petrol 95</span>
            <span class="green">${country.petrol95}€</span>
          </div>

          <div class="price-row">
            <span>Diesel</span>
            <span class="yellow">${country.diesel}€</span>
          </div>

          <div class="price-row">
            <span>LPG</span>
            <span class="blue">${country.lpg}€</span>
          </div>

          <div class="updated">
            Updated: ${country.updated}
          </div>
        `;

        cardsContainer.appendChild(card);
      });
    }

    loadPrices();
  </script>

</body>
</html>
