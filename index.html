<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gasolina. cene goriva i granice na Balkanu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 24px;
      padding-top: max(40px, env(safe-area-inset-top));
      background: #0f172a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }
    .container { max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 42px; margin: 0 0 4px; letter-spacing: -0.5px; }
    .subtitle { color: #94a3b8; margin: 0 0 8px; font-size: 18px; }
    .meta { color: #64748b; margin: 0 0 24px; font-size: 13px; }

    .tabs {
      display: inline-flex; gap: 0; background: #1e293b;
      border-radius: 999px; padding: 4px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .tabs button {
      background: transparent; color: #94a3b8; border: 0;
      padding: 10px 22px; border-radius: 999px; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.15s;
    }
    .tabs button.active { background: #38bdf8; color: #0f172a; }

    .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 28px; }
    .toggle { display: inline-flex; gap: 0; background: #1e293b; border-radius: 999px; padding: 4px; }
    .toggle button {
      background: transparent; color: #94a3b8; border: 0;
      padding: 8px 18px; border-radius: 999px; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.15s;
    }
    .toggle button.active { background: #38bdf8; color: #0f172a; }
    .sort-wrap { display: inline-flex; align-items: center; gap: 10px; color: #94a3b8; font-size: 14px; }
    .sort-wrap select, .calc-input select, .calc-input input {
      background: #1e293b; color: white; border: 1px solid #334155;
      border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer;
    }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card {
      background: #1e293b; border-radius: 16px; padding: 24px;
      border: 1px solid #334155; transition: all 0.15s;
    }
    .card:hover { transform: translateY(-2px); border-color: #475569; }
    .country { font-size: 24px; margin-bottom: 4px; font-weight: 700; }
    .currency-info { font-size: 12px; color: #64748b; margin-bottom: 20px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 17px; gap: 12px; }
    .fuel-name { color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
    .fuel-price { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .fuel-price .secondary { font-size: 12px; color: #64748b; font-weight: 400; margin-left: 6px; }
    .green { color: #22c55e; } .yellow { color: #facc15; } .blue { color: #38bdf8; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; vertical-align: middle;
    }
    .badge-best { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-worst { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .updated { margin-top: 20px; padding-top: 16px; border-top: 1px solid #334155; color: #64748b; font-size: 12px; }

    .calc-form { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-bottom: 28px; }
    .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .calc-input { display: flex; flex-direction: column; gap: 6px; }
    .calc-input label { color: #94a3b8; font-size: 13px; }
    .calc-input select, .calc-input input { width: 100%; }
    .calc-input .range-row { display: flex; align-items: center; gap: 10px; }
    .calc-input input[type="range"] { flex: 1; padding: 0; cursor: pointer; background: transparent; border: 0; }
    .calc-input .val { min-width: 70px; text-align: right; font-weight: 600; color: white; font-variant-numeric: tabular-nums; }

    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .result-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; }
    .result-box.smart { border-color: rgba(34, 197, 94, 0.5); }
    .result-box h3 { margin: 0 0 4px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; font-weight: 600; }
    .result-box .total { font-size: 32px; font-weight: 700; margin: 8px 0 16px; font-variant-numeric: tabular-nums; }
    .result-box.smart .total { color: #22c55e; }
    .result-box .step { font-size: 14px; color: #cbd5e1; margin-bottom: 6px; line-height: 1.5; }
    .savings-banner {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(56, 189, 248, 0.1));
      border: 1px solid rgba(34, 197, 94, 0.4); border-radius: 16px; padding: 20px 24px; text-align: center; margin-bottom: 24px;
    }
    .savings-banner .label { color: #94a3b8; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .savings-banner .amount { font-size: 36px; font-weight: 700; color: #22c55e; font-variant-numeric: tabular-nums; }
    .savings-banner .pct { color: #94a3b8; font-size: 14px; margin-top: 6px; }

    /* Borders / crossings */
    .border-group { margin-bottom: 32px; }
    .border-group h2 {
      font-size: 18px; margin: 0 0 14px; color: #e2e8f0;
      display: flex; align-items: center; gap: 8px;
    }
    .border-note {
      background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px; padding: 14px 18px; margin-bottom: 24px;
      color: #cbd5e1; font-size: 13px; line-height: 1.6;
    }
    .crossing-card {
      background: #1e293b; border-radius: 14px; padding: 18px 20px;
      border: 1px solid #334155; display: flex; flex-direction: column; gap: 12px;
    }
    .crossing-card:hover { border-color: #475569; }
    .crossing-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .crossing-name { font-size: 18px; font-weight: 700; }
    .crossing-dir { font-size: 12px; color: #64748b; margin-top: 2px; }
    .crossing-wait { font-size: 14px; color: #94a3b8; }
    .crossing-wait strong { color: #e2e8f0; }
    .cam-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: #38bdf8; color: #0f172a; text-decoration: none;
      padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px;
      transition: background 0.15s;
    }
    .cam-btn:hover { background: #0ea5e9; }

    .empty { text-align: center; padding: 60px 20px; color: #64748b; }

    @media (max-width: 720px) { .results { grid-template-columns: 1fr; } }
    @media (max-width: 600px) {
      body { padding: 20px 14px; padding-top: max(24px, env(safe-area-inset-top)); }
      h1 { font-size: 32px; }
      .subtitle { font-size: 16px; }
      .cards { grid-template-columns: 1fr; gap: 14px; }
      .card { padding: 18px; }
      .calc-form { padding: 18px; }
      .calc-grid { grid-template-columns: 1fr; gap: 14px; }
      .controls { gap: 12px; }
      .tabs button, .toggle button { padding: 10px 16px; }
      .savings-banner .amount { font-size: 30px; }
      .result-box .total { font-size: 26px; }
      .calc-input input[type="range"] { height: 28px; }
    }
    button:focus, select:focus { outline: none; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4); }
    button:focus:not(:focus-visible), select:focus:not(:focus-visible) { box-shadow: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⛽ Gasolina</h1>
    <p class="subtitle">Cene goriva i granice na Balkanu</p>
    <p class="meta" id="meta">Učitavanje...</p>

    <div class="tabs" role="tablist">
      <button id="tabPrices" class="active" onclick="setTab('prices')">Cene</button>
      <button id="tabCalc" onclick="setTab('calc')">Kalkulator puta</button>
      <button id="tabBorders" onclick="setTab('borders')">Granice</button>
    </div>

    <!-- PRICES -->
    <section id="viewPrices">
      <div class="controls">
        <div class="toggle" role="tablist">
          <button id="btnEur" class="active" onclick="setView('eur')">EUR</button>
          <button id="btnLocal" onclick="setView('local')">Lokalna valuta</button>
        </div>
        <div class="sort-wrap">
          <span>Sortiraj:</span>
          <select id="sortSel" onchange="setSort(this.value)">
            <option value="default">Podrazumevano</option>
            <option value="name">Po imenu (A-Z)</option>
            <option value="petrol95">Po benzinu 95</option>
            <option value="diesel">Po dizelu</option>
            <option value="lpg">Po auto-gasu</option>
          </select>
        </div>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- CALCULATOR -->
    <section id="viewCalc" style="display:none">
      <div class="calc-form">
        <div class="calc-grid">
          <div class="calc-input">
            <label for="routeSel">Ruta</label>
            <select id="routeSel" onchange="renderCalc()"></select>
          </div>
          <div class="calc-input">
            <label for="fuelSel">Vrsta goriva</label>
            <select id="fuelSel" onchange="renderCalc()">
              <option value="diesel">Dizel</option>
              <option value="petrol95">Benzin 95</option>
              <option value="lpg">Auto-gas (LPG)</option>
            </select>
          </div>
          <div class="calc-input">
            <label for="returnSel">Povratak</label>
            <select id="returnSel" onchange="renderCalc()">
              <option value="oneway">Samo odlazak</option>
              <option value="roundtrip" selected>Povratak (ista ruta)</option>
            </select>
          </div>
          <div class="calc-input">
            <label for="consInp">Potrošnja (L/100km)</label>
            <div class="range-row">
              <input id="consInp" type="range" min="3" max="15" step="0.1" value="7" oninput="renderCalc()"/>
              <span class="val" id="consVal">7,0 L</span>
            </div>
          </div>
          <div class="calc-input">
            <label for="tankInp">Veličina rezervoara (L)</label>
            <div class="range-row">
              <input id="tankInp" type="range" min="30" max="100" step="1" value="50" oninput="renderCalc()"/>
              <span class="val" id="tankVal">50 L</span>
            </div>
          </div>
          <div class="calc-input">
            <label for="startInp">Početno gorivo</label>
            <div class="range-row">
              <input id="startInp" type="range" min="0" max="100" step="5" value="25" oninput="renderCalc()"/>
              <span class="val" id="startVal">25%</span>
            </div>
          </div>
        </div>
      </div>
      <div id="calcOutput"></div>
    </section>

    <!-- BORDERS -->
    <section id="viewBorders" style="display:none">
      <div class="border-note">
        📷 Kamere i informacije o stanju na prelazima su vlasništvo MUP-a Srbije. Klikom na "Kamera uživo" otvara se zvanična MUP stranica u novom tabu, gde možeš izabrati željeni prelaz i smer (ulaz/izlaz).
      </div>
      <div id="bordersContainer"></div>
    </section>
  </div>

  <script>
    let dataCache = null;
    let currentTab = 'prices';
    let currentView = 'eur';
    let currentSort = 'default';

    const COUNTRY_NAMES = {
      RS: 'Serbia', HR: 'Croatia', BA: 'Bosnia and Herzegovina', ME: 'Montenegro',
      SI: 'Slovenia', MK: 'North Macedonia', HU: 'Hungary', BG: 'Bulgaria', AL: 'Albania', GR: 'Greece',
    };
    const COUNTRY_FLAG = {
      RS: '🇷🇸', HR: '🇭🇷', BA: '🇧🇦', ME: '🇲🇪', SI: '🇸🇮', MK: '🇲🇰',
      HU: '🇭🇺', BG: '🇧🇬', AL: '🇦🇱', GR: '🇬🇷', RO: '🇷🇴',
    };
    const COUNTRY_LABEL = {
      RS: 'Srbija', HR: 'Hrvatska', BA: 'BiH', ME: 'Crna Gora', SI: 'Slovenija',
      MK: 'S. Makedonija', HU: 'Mađarska', BG: 'Bugarska', AL: 'Albanija', GR: 'Grčka', RO: 'Rumunija',
    };

    const ROUTES = [
      { id: 'bg-bd', label: 'Beograd → Budva (Crna Gora)', legs: [{c:'RS', km:330}, {c:'ME', km:200}] },
      { id: 'bg-sa', label: 'Beograd → Sarajevo', legs: [{c:'RS', km:140}, {c:'BA', km:150}] },
      { id: 'bg-st', label: 'Beograd → Split', legs: [{c:'RS', km:120}, {c:'HR', km:600}] },
      { id: 'bg-sk', label: 'Beograd → Skopje', legs: [{c:'RS', km:330}, {c:'MK', km:110}] },
      { id: 'bg-lj', label: 'Beograd → Ljubljana', legs: [{c:'RS', km:120}, {c:'HR', km:280}, {c:'SI', km:130}] },
      { id: 'bg-zg', label: 'Beograd → Zagreb', legs: [{c:'RS', km:130}, {c:'HR', km:270}] },
      { id: 'ni-sk', label: 'Niš → Skopje', legs: [{c:'RS', km:120}, {c:'MK', km:110}] },
      { id: 'zg-bg', label: 'Zagreb → Beograd', legs: [{c:'HR', km:270}, {c:'RS', km:130}] },
      { id: 'lj-bg', label: 'Ljubljana → Beograd', legs: [{c:'SI', km:130}, {c:'HR', km:280}, {c:'RS', km:120}] },
      { id: 'st-sa', label: 'Split → Sarajevo', legs: [{c:'HR', km:140}, {c:'BA', km:110}] },
      { id: 'bg-so', label: 'Beograd → Solun (Grčka)', legs: [{c:'RS', km:330}, {c:'MK', km:170}, {c:'GR', km:160}] },
      { id: 'bg-sf', label: 'Beograd → Sofija', legs: [{c:'RS', km:240}, {c:'BG', km:150}] },
      { id: 'ni-sf', label: 'Niš → Sofija', legs: [{c:'RS', km:60}, {c:'BG', km:105}] },
      { id: 'bg-bp', label: 'Beograd → Budimpešta', legs: [{c:'RS', km:170}, {c:'HU', km:210}] },
      { id: 'bg-ti', label: 'Beograd → Tirana (Albanija)', legs: [{c:'RS', km:330}, {c:'ME', km:200}, {c:'AL', km:300}] },
    ];

    // Official MUP border crossings grouped by neighbouring country.
    const MUP_CAMERAS_URL = 'https://www.mup.gov.rs/wps/portal/sr/kamerе/kamerеGP';
    const BORDER_GROUPS = [
      { country: 'HU', crossings: ['Horgoš', 'Kelebija', 'Đala'] },
      { country: 'HR', crossings: ['Batrovci', 'Šid'] },
      { country: 'BA', crossings: ['Kotroman', 'Mali Zvornik', 'Sremska Rača', 'Trbušnica'] },
      { country: 'ME', crossings: ['Gostun', 'Jabuka', 'Špiljani'] },
      { country: 'BG', crossings: ['Gradina', 'Vrška Čuka'] },
      { country: 'MK', crossings: ['Preševo'] },
      { country: 'RO', crossings: ['Vatin'] },
    ];

    function fmt(value, currency) {
      if (value === null || value === undefined) return '-';
      const opts = { minimumFractionDigits: 2, maximumFractionDigits: 2 };
      const num = Number(value).toLocaleString('sr-RS', opts);
      if (currency === 'EUR') return num + ' €';
      return num + ' ' + currency;
    }
    function fmtEur(value) { return fmt(value, 'EUR'); }
    function findCountry(code) {
      if (!dataCache) return null;
      return dataCache.countries.find(c => c.name === COUNTRY_NAMES[code]) || null;
    }
    function priceCell(fuel, country) {
      if (!fuel) return '<span style="color:#475569">-</span>';
      if (currentView === 'eur') {
        return `${fmt(fuel.eur, 'EUR')}<span class="secondary">${fmt(fuel.local, country.currency)}</span>`;
      }
      return `${fmt(fuel.local, country.currency)}<span class="secondary">${fmt(fuel.eur, 'EUR')}</span>`;
    }

    function computeBestWorst(countries) {
      const fuels = ['petrol95', 'diesel', 'lpg'];
      const result = { petrol95: {}, diesel: {}, lpg: {} };
      fuels.forEach(f => {
        const valid = countries.filter(c => c[f] && typeof c[f].eur === 'number');
        if (valid.length < 2) return;
        const min = valid.reduce((a, b) => a[f].eur < b[f].eur ? a : b);
        const max = valid.reduce((a, b) => a[f].eur > b[f].eur ? a : b);
        result[f].best = min.name; result[f].worst = max.name;
      });
      return result;
    }
    function badgeFor(fuelKey, country, bw) {
      const x = bw[fuelKey];
      if (!x) return '';
      if (country.name === x.best) return ' <span class="badge badge-best">najjeftinije</span>';
      if (country.name === x.worst) return ' <span class="badge badge-worst">najskuplje</span>';
      return '';
    }
    function sortCountries(countries) {
      const arr = [...countries];
      const byEur = (k) => (a, b) => (a[k]?.eur ?? Infinity) - (b[k]?.eur ?? Infinity);
      switch (currentSort) {
        case 'name': return arr.sort((a, b) => a.name.localeCompare(b.name));
        case 'petrol95': return arr.sort(byEur('petrol95'));
        case 'diesel': return arr.sort(byEur('diesel'));
        case 'lpg': return arr.sort(byEur('lpg'));
        default: return arr;
      }
    }
    function renderPrices() {
      const cards = document.getElementById('cards');
      cards.innerHTML = '';
      if (!dataCache?.countries?.length) { cards.innerHTML = '<div class="empty">Nema podataka.</div>'; return; }
      const bw = computeBestWorst(dataCache.countries);
      sortCountries(dataCache.countries).forEach(c => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="country">${c.flag || ''} ${c.name}</div>
          <div class="currency-info">Valuta: ${c.currency}${c.fx_rate_eur && c.currency !== 'EUR' ? ` · 1 EUR ≈ ${c.fx_rate_eur} ${c.currency}` : ''}</div>
          <div class="price-row"><span class="fuel-name">Benzin 95${badgeFor('petrol95', c, bw)}</span><span class="fuel-price green">${priceCell(c.petrol95, c)}</span></div>
          <div class="price-row"><span class="fuel-name">Dizel${badgeFor('diesel', c, bw)}</span><span class="fuel-price yellow">${priceCell(c.diesel, c)}</span></div>
          <div class="price-row"><span class="fuel-name">Auto-gas${badgeFor('lpg', c, bw)}</span><span class="fuel-price blue">${priceCell(c.lpg, c)}</span></div>
          <div class="updated">Ažurirano: ${c.updated || '-'}</div>`;
        cards.appendChild(card);
      });
    }

    function getFuelEur(country, fuelKey) { return (country && country[fuelKey]) ? country[fuelKey].eur : null; }

    function computeTrip() {
      const route = ROUTES.find(r => r.id === document.getElementById('routeSel').value);
      const fuelKey = document.getElementById('fuelSel').value;
      const cons = parseFloat(document.getElementById('consInp').value);
      const tank = parseFloat(document.getElementById('tankInp').value);
      const startPct = parseFloat(document.getElementById('startInp').value);
      if (!route || !dataCache) return null;

      const returnMode = document.getElementById('returnSel').value;
      const isRoundtrip = returnMode === 'roundtrip';
      const tripLegs = isRoundtrip ? [...route.legs, ...route.legs.slice().reverse()] : route.legs;

      const totalKm = tripLegs.reduce((sum, l) => sum + l.km, 0);
      const totalFuelNeeded = (totalKm * cons) / 100;
      const startFuel = (startPct / 100) * tank;
      const fuelToBuy = Math.max(0, totalFuelNeeded - startFuel);

      const legs = tripLegs.map(l => {
        const country = findCountry(l.c);
        return { ...l, country, fuelOnLeg: (l.km * cons) / 100, pricePerL: getFuelEur(country, fuelKey),
                 flag: COUNTRY_FLAG[l.c], label: COUNTRY_LABEL[l.c] };
      });

      const naiveCountry = legs[0]?.country;
      const naivePrice = getFuelEur(naiveCountry, fuelKey);
      const naiveCost = naivePrice ? fuelToBuy * naivePrice : null;

      const minPriceByLeg = legs.map((_, i) =>
        legs.slice(i).filter(l => l.pricePerL).reduce((min, l) => Math.min(min, l.pricePerL), Infinity));

      let tankLevel = startFuel;
      const plan = [];
      let smartCost = 0;

      for (let i = 0; i < legs.length; i++) {
        const leg = legs[i];
        const need = leg.fuelOnLeg;
        const remainingKmAfterThis = legs.slice(i + 1).reduce((s, l) => s + l.km, 0);
        const fuelStillNeededAfterThis = (remainingKmAfterThis * cons) / 100;
        const cheapestAhead = minPriceByLeg[i];
        if (leg.pricePerL && leg.pricePerL <= cheapestAhead + 1e-6) {
          const neededTotalFromHere = need + fuelStillNeededAfterThis;
          const buyAmount = Math.min(tank - tankLevel, Math.max(0, neededTotalFromHere - tankLevel));
          if (buyAmount > 0.01) {
            smartCost += buyAmount * leg.pricePerL;
            plan.push({ flag: leg.flag, label: leg.label, liters: buyAmount, price: leg.pricePerL, cost: buyAmount * leg.pricePerL });
            tankLevel += buyAmount;
          }
        }
        tankLevel -= need;
        if (tankLevel < -0.01) {
          const forced = Math.min(tank, -tankLevel + 5);
          if (leg.pricePerL) {
            smartCost += forced * leg.pricePerL;
            plan.push({ flag: leg.flag, label: leg.label, liters: forced, price: leg.pricePerL, cost: forced * leg.pricePerL, forced: true });
            tankLevel += forced;
          }
        }
      }
      return { route, fuelKey, cons, tank, startFuel, totalKm, totalFuelNeeded, fuelToBuy, legs, naiveCost, naiveCountry, smartCost, plan };
    }

    function fuelLabel(key) { return { diesel: 'dizel', petrol95: 'benzin 95', lpg: 'auto-gas' }[key]; }

    function renderCalc() {
      document.getElementById('consVal').textContent = parseFloat(document.getElementById('consInp').value).toFixed(1).replace('.', ',') + ' L';
      document.getElementById('tankVal').textContent = document.getElementById('tankInp').value + ' L';
      document.getElementById('startVal').textContent = document.getElementById('startInp').value + '%';

      const out = document.getElementById('calcOutput');
      const t = computeTrip();
      if (!t) { out.innerHTML = ''; return; }
      const fuelText = fuelLabel(t.fuelKey);

      let smartHtml = '';
      if (t.plan.length === 0) {
        smartHtml = `<div class="step">Imaš dovoljno goriva za ceo put. nema potrebe za punjenjem.</div>`;
      } else {
        t.plan.forEach((p, i) => {
          smartHtml += `<div class="step">${i + 1}. ${p.flag} <strong>${p.label}</strong>: kupi <strong>${p.liters.toFixed(1).replace('.', ',')} L</strong> po ${fmtEur(p.price)} = <strong>${fmtEur(p.cost)}</strong></div>`;
        });
      }
      const naiveHtml = t.naiveCost !== null
        ? `<div class="step">Kupi sve gorivo (${t.fuelToBuy.toFixed(1).replace('.', ',')} L) u ${COUNTRY_FLAG[t.legs[0].c]} <strong>${COUNTRY_LABEL[t.legs[0].c]}</strong> po ${fmtEur(t.legs[0].pricePerL)}</div>`
        : `<div class="step">Nedostaju cene za izabranu zemlju polaska.</div>`;
      const savings = (t.naiveCost !== null && t.smartCost > 0) ? Math.max(0, t.naiveCost - t.smartCost) : 0;
      const savingsPct = (t.naiveCost > 0) ? (savings / t.naiveCost) * 100 : 0;

      out.innerHTML = `
        ${savings > 0.5 ? `<div class="savings-banner"><div class="label">Pametna strategija ti štedi</div><div class="amount">${fmtEur(savings)}</div><div class="pct">${savingsPct.toFixed(0)}% jeftinije nego naivno (${fuelText})</div></div>` : ''}
        <div class="results">
          <div class="result-box smart"><h3>🧠 Pametna strategija</h3><div class="total">${t.smartCost > 0 ? fmtEur(t.smartCost) : '-'}</div>${smartHtml}</div>
          <div class="result-box"><h3>😴 Naivno (sve u polasku)</h3><div class="total">${t.naiveCost !== null ? fmtEur(t.naiveCost) : '-'}</div>${naiveHtml}</div>
        </div>
        <div class="result-box">
          <h3>📋 Detalji puta</h3>
          <div class="step">Ruta: <strong>${t.route.label}</strong> (${t.totalKm} km)</div>
          <div class="step">Potrošnja: ${t.cons.toFixed(1).replace('.', ',')} L/100km · Rezervoar: ${t.tank} L · Početno gorivo: ${(t.startFuel).toFixed(1).replace('.', ',')} L</div>
          <div class="step">Ukupno potrebno: <strong>${t.totalFuelNeeded.toFixed(1).replace('.', ',')} L</strong> · Treba kupiti: <strong>${t.fuelToBuy.toFixed(1).replace('.', ',')} L</strong></div>
          <div class="step" style="margin-top:10px">Cene ${fuelText} po deonici:</div>
          ${t.legs.map(l => `<div class="step">${l.flag} ${l.label} (${l.km} km): ${l.pricePerL ? fmtEur(l.pricePerL) + ' / L' : '<span style="color:#f87171">cena nedostupna</span>'}</div>`).join('')}
        </div>`;
    }

    function populateRoutes() {
      document.getElementById('routeSel').innerHTML = ROUTES.map(r => `<option value="${r.id}">${r.label}</option>`).join('');
    }

    function renderBorders() {
      const cont = document.getElementById('bordersContainer');
      cont.innerHTML = BORDER_GROUPS.map(group => {
        const flag = COUNTRY_FLAG[group.country];
        const label = COUNTRY_LABEL[group.country];
        const cards = group.crossings.map(name => `
          <div class="crossing-card">
            <div class="crossing-head">
              <div>
                <div class="crossing-name">${name}</div>
                <div class="crossing-dir">ka ${label} ${flag}</div>
              </div>
            </div>
            <div class="crossing-wait">⏱️ Čekanje: <strong>--</strong></div>
            <a class="cam-btn" href="${MUP_CAMERAS_URL}" target="_blank" rel="noopener noreferrer">📷 Kamera uživo →</a>
          </div>`).join('');
        return `<div class="border-group">
          <h2>${flag} Granica sa: ${label}</h2>
          <div class="cards">${cards}</div>
        </div>`;
      }).join('');
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tabPrices').classList.toggle('active', tab === 'prices');
      document.getElementById('tabCalc').classList.toggle('active', tab === 'calc');
      document.getElementById('tabBorders').classList.toggle('active', tab === 'borders');
      document.getElementById('viewPrices').style.display = tab === 'prices' ? '' : 'none';
      document.getElementById('viewCalc').style.display = tab === 'calc' ? '' : 'none';
      document.getElementById('viewBorders').style.display = tab === 'borders' ? '' : 'none';
      if (tab === 'calc') renderCalc();
      if (tab === 'borders') renderBorders();
    }
    function setView(view) {
      currentView = view;
      document.getElementById('btnEur').classList.toggle('active', view === 'eur');
      document.getElementById('btnLocal').classList.toggle('active', view === 'local');
      renderPrices();
    }
    function setSort(sort) { currentSort = sort; renderPrices(); }

    async function load() {
      try {
        const res = await fetch('fuel_prices.json?cb=' + Date.now());
        dataCache = await res.json();
        const dates = dataCache.countries.map(c => c.updated).filter(Boolean);
        document.getElementById('meta').textContent =
          `${dataCache.countries.length} zemalja · poslednje ažuriranje: ${dates[0] || '-'}`;
        populateRoutes();
        renderPrices();
      } catch (err) {
        document.getElementById('meta').textContent = 'Greška pri učitavanju podataka.';
        console.error(err);
      }
    }
    load();
  </script>
</body>
</html>
