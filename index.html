<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gasolina</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 40px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
    }

    .country {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 20px;
    }

    .green {
      color: #22c55e;
    }

    .yellow {
      color: #facc15;
    }

    .blue {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h1>⛽ Gasolina</h1>
  <p>Balkan Fuel Prices</p>

  <div class="card">
    <div class="country">🇷🇸 Serbia</div>

    <div class="price-row">
      <span>Petrol 95</span>
      <span class="green">1.60€</span>
    </div>

    <div class="price-row">
      <span>Diesel</span>
      <span class="yellow">1.68€</span>
    </div>

    <div class="price-row">
      <span>LPG</span>
      <span class="blue">0.85€</span>
    </div>
  </div>

</body>
</html>
